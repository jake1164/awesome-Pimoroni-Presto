name: Link Checker

# Run weekly on Mondays at 9:00 AM UTC, manually via workflow_dispatch, and on pull requests
on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - '.lycherc.toml'
      - '.github/workflows/link-checker.yml'

jobs:
  link-checker:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read      # Required to checkout the repository
      issues: write       # Required to create/update issues on link failures
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v1
        with:
          # Check all markdown files in the repository
          args: --config .lycherc.toml --verbose --no-progress '**/*.md'
          lycheeVersion: '0.15.0'
          format: markdown
          output: lychee/out.md
          jobSummary: true
          # Fail the action on broken links
          fail: true
        env:
          # Use GitHub token to avoid rate limiting on GitHub links
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload link check report
        if: ${{ !cancelled() && steps.lychee.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: lychee/out.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Report link check failure
        if: ${{ !cancelled() && steps.lychee.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const workflowUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const report = fs.existsSync('lychee/out.md')
              ? fs.readFileSync('lychee/out.md', 'utf8').trim()
              : '';
            // Lychee 0.15 uses exit code 2 for failed links; other codes mean the checker failed.
            const brokenLinks = process.env.lychee_exit_code === '2' && report.length > 0;
            const title = brokenLinks ? '🔗 Broken Links Detected' : '⚠️ Link Checker Failed';
            const labels = brokenLinks ? ['broken-links', 'automated'] : ['automated'];
            // Leave room below GitHub's issue body limit. The artifact contains the full report.
            const excerpt = Array.from(report).slice(0, 50000).join('');
            const details = brokenLinks
              ? `${excerpt}${excerpt.length < report.length ? '\n\n_Report truncated; download the full report from the workflow run._' : ''}`
              : `The link checker failed (exit code: ${process.env.lychee_exit_code || 'unavailable'}). This does not establish that any links are broken. Open **Check links with Lychee** in the workflow logs for the error.`;
            const body = `${details}\n\n**[Workflow run and logs](${workflowUrl})**\n\nIf a report was generated, the full Markdown file is available under **Artifacts → link-check-report** on that run (retained for 14 days).`;

            if (!brokenLinks) {
              await core.summary.addHeading('Link checker failed').addRaw(body).write();
            }
            // Pull requests still get logs, a summary and an artifact without needing issue write access.
            if (context.eventName === 'pull_request') return;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(',')
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);

            if (!existing) {
              // Create a new issue if none exists
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: labels
              });
            } else {
              // Comment on the existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body
              });
            }
