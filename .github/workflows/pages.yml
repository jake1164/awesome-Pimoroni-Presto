name: Build and deploy gallery

# Pull requests build and test the gallery but never deploy. Pushes to main, manual runs on main and the
# weekly scheduled run deploy only after catalog validation, the site tests, and the browser tests pass.
#
# The scheduled run (Mondays 04:17 UTC, on the default branch) re-checks every project image and refreshes every
# GitHub star count, because both change without any README change. It runs exactly the same validation and
# tests as a push and then deploys like a push. It does not try to detect "nothing changed": the star counts
# alone make the page differ almost every week, and a comparison against the live page is one more thing that can
# be wrong. GitHub pauses scheduled workflows after 60 days without repository activity.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be deploying; only superseded pull-request runs are cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reuses the validated README catalog workflow (parser plus Python tests). Do not re-implement it here.
  catalog-validation:
    uses: ./.github/workflows/catalog.yml

  build:
    needs: catalog-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Download validated catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: presto-catalog
          path: site/src/data

      # Project images and GitHub star counts are collected at build time and remembered in disposable files under
      # site/.cache. A cache miss only means the next build looks them up again; nothing depends on it. Star counts are
      # trusted for 24 hours, so a restored cache from an earlier push is reused and the weekly run finds it expired.
      - name: Restore generated build cache (project images, GitHub stars)
        uses: actions/cache@v4
        with:
          path: site/.cache
          key: gallery-cache-${{ github.run_id }}
          restore-keys: gallery-cache-

      - name: Build site
        working-directory: site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRESTO_CATALOG_ARTIFACT: src/data/catalog.json
          # Optional: only raises the GitHub API rate limit for image discovery and star counts. Builds work without
          # it, and it needs no permission beyond the read-only contents access this job already has.
          GITHUB_TOKEN: ${{ github.token }}
          # Scheduled runs look every image up again instead of trusting cache entries up to a week old.
          # The restored cache is still used when a lookup fails, so a network problem keeps earlier results.
          PRESTO_IMAGE_REFRESH: ${{ github.event_name == 'schedule' && '1' || '' }}

      - name: Run website integration tests
        working-directory: site
        run: npm test

      - name: Install browser for smoke tests
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests against the production build
        working-directory: site
        run: npm run test:browser
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jake1164/awesome-Pimoroni-Presto'
    needs: [catalog-validation, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
