name: Build and deploy gallery

# Pull requests build and test the gallery but never deploy. Pushes to main, manual runs on main and the
# weekly scheduled run deploy only after catalog validation, the site tests, and the browser tests pass.
#
# The scheduled run (Mondays 04:17 UTC, on the default branch) re-checks every project image, because remote
# images change or disappear without any README change. It runs exactly the same validation and tests as a
# push. It redeploys only if the rebuilt page differs from the live one (see "Detect whether a scheduled
# refresh changed the site"). GitHub pauses scheduled workflows after 60 days without repository activity.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be deploying; only superseded pull-request runs are cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reuses the validated README catalog workflow (parser plus Python tests). Do not re-implement it here.
  catalog-validation:
    uses: ./.github/workflows/catalog.yml

  build:
    needs: catalog-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Download validated catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: presto-catalog
          path: site/src/data

      # Project images are discovered at build time and remembered in a disposable cache. A cache miss only means
      # the next build looks the images up again; nothing depends on it.
      - name: Restore project image cache
        uses: actions/cache@v4
        with:
          path: site/.cache
          key: project-images-${{ github.run_id }}
          restore-keys: project-images-

      - name: Build site
        working-directory: site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRESTO_CATALOG_ARTIFACT: src/data/catalog.json
          # Optional: only raises the GitHub API rate limit for image discovery. Builds work without it.
          GITHUB_TOKEN: ${{ github.token }}
          # Scheduled runs look every image up again instead of trusting cache entries up to a week old.
          # The restored cache is still used when a lookup fails, so a network problem keeps earlier results.
          PRESTO_IMAGE_REFRESH: ${{ github.event_name == 'schedule' && '1' || '' }}

      - name: Run website integration tests
        working-directory: site
        run: npm test

      - name: Install browser for smoke tests
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests against the production build
        working-directory: site
        run: npm run test:browser
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Every card, link and image URL is in index.html, and asset file names carry content hashes, so a
      # byte-identical index.html means a visitor would see no difference. If the live page cannot be fetched,
      # the safe default is to deploy. Only scheduled runs skip a deployment; pushes and manual runs always deploy.
      - name: Detect whether a scheduled refresh changed the site
        id: changed
        if: github.event_name == 'schedule'
        env:
          LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          new=$(sha256sum site/dist/index.html | cut -d' ' -f1)
          if live=$(curl --fail --silent --show-error --location --max-time 30 "$LIVE_URL" | sha256sum | cut -d' ' -f1) && [ "$live" = "$new" ]; then
            echo "The refreshed page is identical to the live page; skipping deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.changed.outputs.deploy != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jake1164/awesome-Pimoroni-Presto' && needs.build.outputs.deploy != 'false'
    needs: [catalog-validation, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
