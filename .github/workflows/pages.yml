name: Build and deploy gallery

# Pull requests build and test the gallery but never deploy. Pushes to main (and manual runs
# on main) deploy only after catalog validation, the site tests, and the browser tests pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be deploying; only superseded pull-request runs are cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reuses the validated README catalog workflow (parser plus Python tests). Do not re-implement it here.
  catalog-validation:
    uses: ./.github/workflows/catalog.yml

  build:
    needs: catalog-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Download validated catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: presto-catalog
          path: site/src/data

      - name: Build site
        working-directory: site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRESTO_CATALOG_ARTIFACT: src/data/catalog.json

      - name: Run website integration tests
        working-directory: site
        run: npm test

      - name: Install browser for smoke tests
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests against the production build
        working-directory: site
        run: npm run test:browser
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jake1164/awesome-Pimoroni-Presto'
    needs: [catalog-validation, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
